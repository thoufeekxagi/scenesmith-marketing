name: Marketing CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:content
      - run: pnpm test:content-safety
      - run: pnpm typecheck
      - name: Build and verify the noindex preview
        if: github.event_name == 'pull_request'
        run: pnpm build && pnpm verify:preview
        env:
          SCENESMITH_NOINDEX: "true"
      - name: Build production output
        if: github.event_name != 'pull_request'
        run: pnpm build
      - run: pnpm verify:marketing
