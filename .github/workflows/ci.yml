name: Marketing CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:content
      - run: pnpm test:content-safety
      - run: pnpm typecheck
      - name: Build and verify the noindex preview
        if: github.event_name == 'pull_request'
        run: pnpm build && pnpm verify:preview
        env:
          SCENESMITH_NOINDEX: "true"
      - name: Build production output
        if: github.event_name != 'pull_request'
        run: pnpm build
      - run: pnpm verify:marketing
